<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="Arial, Helvetica, sans-serif">
  <rect width="1100" height="520" fill="#f8fafc" rx="12"/>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#14532d">Function Hierarchy</text>
  <!-- main -->
  <rect x="470" y="60" width="160" height="44" rx="10" fill="#14532d"/>
  <text x="550" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">main()</text>
  <rect x="720" y="62" width="160" height="40" rx="10" fill="#15803d"/>
  <text x="800" y="87" text-anchor="middle" font-size="15" fill="#fff">show_menu()</text>
  <line x1="630" y1="82" x2="720" y2="82" stroke="#374151" stroke-width="2"/>
  <text x="675" y="74" text-anchor="middle" font-size="12" fill="#6b7280">calls</text>
  <line x1="550" y1="104" x2="550" y2="200" stroke="#374151" stroke-width="2"/>
  <line x1="75" y1="200" x2="1025" y2="200" stroke="#374151" stroke-width="2"/>
  <!-- options -->
  <g font-size="12.5" text-anchor="middle" fill="#fff">
    <g><line x1="75" y1="200" x2="75" y2="225" stroke="#374151" stroke-width="2"/><rect x="10" y="225" width="130" height="50" rx="8" fill="#b45309"/><text x="75" y="247">1</text><text x="75" y="265">add_product()</text></g>
    <g><line x1="212" y1="200" x2="212" y2="225" stroke="#374151" stroke-width="2"/><rect x="147" y="225" width="130" height="50" rx="8" fill="#b45309"/><text x="212" y="247">2</text><text x="212" y="265">view_all_products()</text></g>
    <g><line x1="350" y1="200" x2="350" y2="225" stroke="#374151" stroke-width="2"/><rect x="285" y="225" width="130" height="50" rx="8" fill="#b45309"/><text x="350" y="247">3</text><text x="350" y="265">search_product()</text></g>
    <g><line x1="487" y1="200" x2="487" y2="225" stroke="#374151" stroke-width="2"/><rect x="422" y="225" width="130" height="50" rx="8" fill="#b45309"/><text x="487" y="247">4</text><text x="487" y="265">update_stock()</text></g>
    <g><line x1="625" y1="200" x2="625" y2="225" stroke="#374151" stroke-width="2"/><rect x="560" y="225" width="130" height="50" rx="8" fill="#b45309"/><text x="625" y="247">5</text><text x="625" y="265">process_sale()</text></g>
    <g><line x1="762" y1="200" x2="762" y2="225" stroke="#374151" stroke-width="2"/><rect x="697" y="225" width="130" height="50" rx="8" fill="#b45309"/><text x="762" y="247">6</text><text x="762" y="265">view_sales_records()</text></g>
    <g><line x1="900" y1="200" x2="900" y2="225" stroke="#374151" stroke-width="2"/><rect x="835" y="225" width="130" height="50" rx="8" fill="#b45309"/><text x="900" y="247">7</text><text x="900" y="265">generate_report()</text></g>
    <g><line x1="1025" y1="200" x2="1025" y2="225" stroke="#374151" stroke-width="2"/><rect x="975" y="225" width="100" height="50" rx="8" fill="#6b7280"/><text x="1025" y="247">8</text><text x="1025" y="265">Exit (break)</text></g>
  </g>
  <!-- helpers -->
  <text x="550" y="330" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Helper functions used by the options</text>
  <g font-size="14" text-anchor="middle">
    <rect x="40" y="350" width="310" height="120" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="195" y="375" font-weight="700" fill="#15803d">Input validation</text>
    <text x="195" y="402" fill="#1f2937">get_text()</text>
    <text x="195" y="425" fill="#1f2937">get_whole_number()</text>
    <text x="195" y="448" fill="#1f2937">get_price()</text>
    <rect x="395" y="350" width="310" height="120" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="550" y="375" font-weight="700" fill="#15803d">Product lookup</text>
    <text x="550" y="410" fill="#1f2937">find_product()</text>
    <text x="550" y="440" fill="#6b7280">used by add, update, sale</text>
    <rect x="750" y="350" width="310" height="120" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="905" y="375" font-weight="700" fill="#15803d">Display</text>
    <text x="905" y="410" fill="#1f2937">show_product()</text>
    <text x="905" y="440" fill="#6b7280">used by search</text>
  </g>
</svg>
