<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="380" fill="#f8fafc" rx="12"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#14532d">Entity-Relationship Diagram</text>
  <!-- PRODUCT -->
  <rect x="50" y="70" width="290" height="270" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
  <rect x="50" y="70" width="290" height="46" rx="10" fill="#15803d"/>
  <text x="195" y="101" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">PRODUCT  (products list)</text>
  <g font-size="17" fill="#1f2937">
    <text x="70" y="150">id <tspan fill="#b45309" font-weight="700">  PK</tspan></text><text x="320" y="150" text-anchor="end" fill="#6b7280">int, unique</text>
    <text x="70" y="188">name</text><text x="320" y="188" text-anchor="end" fill="#6b7280">str</text>
    <text x="70" y="226">category</text><text x="320" y="226" text-anchor="end" fill="#6b7280">str</text>
    <text x="70" y="264">price</text><text x="320" y="264" text-anchor="end" fill="#6b7280">float &gt; 0</text>
    <text x="70" y="302">stock</text><text x="320" y="302" text-anchor="end" fill="#6b7280">int &gt;= 0</text>
  </g>
  <!-- SALE -->
  <rect x="560" y="70" width="290" height="270" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="3"/>
  <rect x="560" y="70" width="290" height="46" rx="10" fill="#b45309"/>
  <text x="705" y="101" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">SALE  (sales list)</text>
  <g font-size="17" fill="#1f2937">
    <text x="580" y="150">product_id <tspan fill="#15803d" font-weight="700">  FK</tspan></text><text x="830" y="150" text-anchor="end" fill="#6b7280">int</text>
    <text x="580" y="188">product_name</text><text x="830" y="188" text-anchor="end" fill="#6b7280">str</text>
    <text x="580" y="226">quantity_sold</text><text x="830" y="226" text-anchor="end" fill="#6b7280">int &gt;= 1</text>
    <text x="580" y="264">total_amount</text><text x="830" y="264" text-anchor="end" fill="#6b7280">float</text>
  </g>
  <!-- relation -->
  <line x1="340" y1="150" x2="560" y2="150" stroke="#374151" stroke-width="3"/>
  <text x="352" y="140" font-size="18" font-weight="700" fill="#374151">1</text>
  <text x="535" y="140" font-size="18" font-weight="700" fill="#374151">N</text>
  <rect x="395" y="128" width="110" height="44" rx="22" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="450" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">is sold in</text>
  <text x="450" y="215" text-anchor="middle" font-size="14" fill="#6b7280">linked by</text>
  <text x="450" y="235" text-anchor="middle" font-size="14" fill="#6b7280">product id</text>
</svg>
